schemaVersion: 0.4.0
milestones:
  - number: 1
    slug: rich-milestone
    goal: Exercise every optional structured detail slot
    deliverables:
      create:
        - internal/plan/types.go
        - internal/plan/load.go
      modify:
        - go.mod
      test:
        - internal/plan/load_test.go
    contract:
      check: go test ./internal/plan/...
      criteria:
        - name: schema version round-trips
          given: a plan authored against the initial format
          when: it is loaded
          then: it declares schemaVersion 0.1.0
        - name: structured deliverables round-trip
          given: a milestone with create, modify and test deliverables
          when: it is loaded
          then: each list is populated
      paths:
        - internal/plan/**
